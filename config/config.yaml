# 系统配置文件

# 音频捕获配置
audio:
  sample_rate: 16000  # 采样率 Hz
  channels: 1         # 声道数
  chunk_duration: 0.5   # 音频块时长（秒）—— 小块便于低延迟拼窗
  buffer_size: 20     # 队列缓冲大小（从10增加到30）
  volume_threshold: 30  # 音量阈值，低于此值视为静音
  max_consecutive_silence: 5  # 最大连续静音块数
  adaptive_buffer: true  # 是否启用自适应缓冲区
  
# 语音识别配置
whisper:
  backend: "sherpa-stream"  # faster-whisper（离线窗口式）/ sherpa-stream（真流式，低延迟，默认推荐）
  model_size: "medium"    # tiny/base/small/medium/large（仅 faster-whisper 生效）
  language: "zh"          # 语言代码
  device: "cuda"          # cuda/cpu
  compute_type: "int8_float16"  # int8_float16 省显存且快；CPU 用 int8
  max_window_sec: 4.0     # 连续说话时单窗口最长秒数（延迟上限）
  silence_flush_sec: 1.0  # 句尾静音多久触发转写（停顿后出字幕的延迟）
  beam_size: 1            # 束搜索大小，设为1提高速度（仅 faster-whisper 生效）

# 流式识别配置（backend: sherpa-stream 时生效）
streaming:
  model_dir: "models/sherpa-onnx-streaming-zipformer-bilingual-zh-en-2023-02-20"
  decoding_method: "modified_beam_search"
  rule1_min_trailing_silence: 1.0  # 句尾停顿1秒→出字幕（兜底路径）
  rule2_min_trailing_silence: 2.5  # 长静音强制断句
  provider: "cpu"         # cpu 即可实时；cuda 可选
  num_threads: 2
  punctuation_model: "models/sherpa-onnx-punct-ct-transformer-zh-en-vocab272727-2024-04-12"  # 空串则不加载
  early_emit_punctuation: true  # 断句符号稳定提前出字幕：遇到 ，。？！； 等符号后，符号前的句子 stable 秒内未被修正即直接输出（需加载 punctuation_model）
  early_emit_stable_sec: 1.0    # 符号前的句子保持稳定多少秒后提前输出

# 翻译模型配置
translation:
  model_name: "tencent/HY-MT1.5-7B"
  quantization: "none"  # 注意：HY-MT 为 trust_remote_code 自定义模型，bnb 4bit/8bit 会被静默忽略（实测仍 fp16 ~14.8GB）；显存不足时只能换更小的翻译模型
  device_map: "auto"    # auto/cuda/cpu
  max_new_tokens: 100   # 最大生成token数
  temperature: 0.1      # 采样温度
  target_languages:      # 目标翻译语言（源语言为 zh，zh→zh 无意义已移除，翻译耗时减半）
    - "en"  # 英语

# 弹幕展示配置（display_mode: danmaku 时生效）
danmaku:
  window_width: 1920
  window_height: 1080
  font_size: 16
  speed: 8000  # 弹幕移动时间(ms)
  y_range: [800, 1000]  # Y轴随机范围
  color: "white"
  background_alpha: 0.5  # 背景透明度

# 字幕浮窗配置（display_mode: subtitle 时生效）
subtitle:
  width_ratio: 0.6          # 浮窗宽度占屏幕宽度的比例
  y_offset: 100             # 浮窗底部距屏幕底部的距离(px)
  original_font_size: 22    # 识别文本字号
  translation_font_size: 18 # 翻译文本字号
  original_color: "white"
  translation_color: "#ffd966"
  background_alpha: 0.55    # 浮窗背景透明度(0-1)

# 系统配置
system:
  display_mode: "subtitle"  # subtitle = 字幕浮窗（上：识别原文，下：翻译，可拖动）；danmaku = 桌面弹幕；console = 仅控制台日志
  log_level: "INFO"
  max_workers: 4  # 最大工作线程数
  retry_attempts: 3  # 重试次数